name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 插件零运行期依赖：不需要 npm ci / install
      - name: Syntax check
        run: |
          node --check index.js
          node --check lib/core.js
          node --check lib/prompts.js

      - name: Unit tests
        run: npm test

      - name: Package contents smoke test
        run: npm pack --dry-run
